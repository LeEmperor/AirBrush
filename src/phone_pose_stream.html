<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iPhone WebXR Pose Stream (DOM Overlay, Optimized)</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; margin: 0; }

    button { font-size: 16px; padding: 10px 14px; }
    input { width: 100%; padding: 8px; margin: 10px 0; font-size: 14px; box-sizing: border-box; }

    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    #log {
      white-space: pre;
      background: #111;
      color: #ddd;
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      max-height: 35vh;
      font-size: 12px;
      line-height: 1.35;
    }

    /* ---- DOM overlay container (sits above immersive AR) ---- */
    #overlay {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 9999;

      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px;

      pointer-events: auto;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #overlay h1 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: #fff;
    }

    #overlay label { color: #eee; font-size: 14px; }
    #status { color: #eee; font-size: 13px; margin-top: 8px; opacity: 0.9; }
    #hint { color: #ddd; font-size: 12px; margin-top: 6px; opacity: 0.85; }
  </style>
</head>
<body>

  <div id="overlay">
    <h1>WebXR Pose → WebSocket</h1>

    <label>WebSocket URL (computer):</label>
    <input id="wsUrl" value="wss://10.29.177.97:8081/ws" />

    <div class="row">
      <button id="start">Start XR + Stream</button>
      <button id="stop" disabled>Stop</button>
    </div>

    <div id="status">Idle.</div>
    <div id="hint">Optimized: no per-frame "frame" packets, capped log, send-rate control.</div>
    <div id="log"></div>
  </div>

<script>
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');

const LOG_MAX_LINES = 40;
let logLines = [];
function log(msg) {
  logLines.unshift(msg);
  if (logLines.length > LOG_MAX_LINES) logLines.pop();
  logEl.textContent = logLines.join("\n");
}
function setStatus(msg) { statusEl.textContent = msg; }
function nowMs() { return Math.round(performance.now()); }

// ---- state we can clean up on Stop ----
let ws = null;
let session = null;
let gl = null;
let heartbeatId = null;
let running = false;

// ---- streaming knobs ----
// Set to 1 to attempt sending at full XR rate (may be unstable).
// Set to 2 to send ~30Hz when XR is ~60Hz (recommended for stability).
const SEND_EVERY_N_FRAMES = 2;

// FPS meter (on-device)
let fpsLast = performance.now();
let fpsFrames = 0;
let fpsEma = 60;

function setUiRunning(isRunning) {
  running = isRunning;
  document.getElementById('start').disabled = isRunning;
  document.getElementById('stop').disabled = !isRunning;
  setStatus(isRunning ? "Running." : "Idle.");
}

// Stop everything safely (can be called multiple times)
async function stopAll(reason = "stop") {
  log("Stopping: " + reason);

  if (heartbeatId !== null) {
    clearInterval(heartbeatId);
    heartbeatId = null;
  }

  if (session) {
    try { await session.end(); } catch (e) {}
    session = null;
  }

  if (ws) {
    try {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "bye", t_ms: nowMs(), reason }));
      }
      ws.close();
    } catch (e) {}
    ws = null;
  }

  gl = null;
  setUiRunning(false);
  log("Stopped.");
}

// Stop button
document.getElementById('stop').onclick = async () => {
  await stopAll("user_clicked_stop");
};

document.getElementById('start').onclick = async () => {
  log("Clicked start.");

  if (!navigator.xr) {
    log("navigator.xr not found. Open this page inside WebXR Viewer.");
    return;
  }

  if (running) {
    await stopAll("restart");
  }

  setUiRunning(true);

  // ---- WebSocket ----
  const wsUrl = document.getElementById('wsUrl').value.trim();
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    log("WebSocket connected: " + wsUrl);
    ws.send(JSON.stringify({ type: "hello", t_ms: nowMs() }));
  };
  ws.onerror = (e) => log("WebSocket error: " + (e?.message || e));
  ws.onclose = () => {
    log("WebSocket closed");
    stopAll("ws_closed");
  };

  // Heartbeat (keep, but light)
  heartbeatId = setInterval(() => {
    try {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "heartbeat", t_ms: nowMs() }));
      }
    } catch (e) {}
  }, 1000);

  // ---- XR session ----
  try {
    const supportedAR = await navigator.xr.isSessionSupported("immersive-ar").catch(() => false);
    const mode = supportedAR ? "immersive-ar" : "immersive-vr";
    log("Using XR mode: " + mode);

    // Try DOM overlay first
    session = await navigator.xr.requestSession(mode, {
      requiredFeatures: ["local-floor"],
      optionalFeatures: ["local", "dom-overlay"],
      domOverlay: { root: document.getElementById("overlay") }
    });

    session.addEventListener("end", () => stopAll("xr_session_end_event"));

  } catch (e) {
    log("requestSession with DOM overlay failed: " + e);
    try {
      const supportedAR = await navigator.xr.isSessionSupported("immersive-ar").catch(() => false);
      const mode = supportedAR ? "immersive-ar" : "immersive-vr";
      log("Retrying without DOM overlay. (UI may not stay visible.)");

      session = await navigator.xr.requestSession(mode, {
        requiredFeatures: ["local-floor"],
        optionalFeatures: ["local"]
      });

      session.addEventListener("end", () => stopAll("xr_session_end_event"));
    } catch (e2) {
      log("Failed to start XR session: " + e2);
      await stopAll("xr_start_failed");
      return;
    }
  }

  // WebGL baseLayer
  const canvas = document.createElement("canvas");
  gl = canvas.getContext("webgl", { xrCompatible: true });
  if (!gl) {
    log("Failed to create WebGL context.");
    await stopAll("no_webgl");
    return;
  }
  session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

  // Reference space
  let refSpace = await session.requestReferenceSpace("local-floor").catch(() => null);
  if (!refSpace) refSpace = await session.requestReferenceSpace("local").catch(() => null);
  if (!refSpace) {
    log("Failed to get reference space.");
    await stopAll("no_ref_space");
    return;
  }

  log("Streaming started.");

  let sentPose = 0;
  let frameCount = 0;

  // reset fps meter
  fpsLast = performance.now();
  fpsFrames = 0;
  fpsEma = 60;

  function onFrame(t, frame) {
    if (!running || !session) return;

    // FPS meter
    fpsFrames++;
    const now = performance.now();
    if (now - fpsLast >= 1000) {
      const fps = fpsFrames * 1000 / (now - fpsLast);
      fpsEma = 0.9 * fpsEma + 0.1 * fps;
      setStatus(`Running. fps=${fps.toFixed(1)} (ema ${fpsEma.toFixed(1)}) sent=${sentPose}`);
      fpsFrames = 0;
      fpsLast = now;
    }

    try {
      const wsOpen = (ws && ws.readyState === WebSocket.OPEN);
      const pose = frame.getViewerPose(refSpace);

      if (pose && wsOpen) {
        frameCount++;

        // Send at controlled rate for stability
        if (frameCount % SEND_EVERY_N_FRAMES === 0) {
          const tr = pose.views[0].transform;
          ws.send(JSON.stringify({
            type: "pose",
            t_ms: nowMs(),
            pos:  { x: tr.position.x,    y: tr.position.y,    z: tr.position.z },
            quat: { x: tr.orientation.x, y: tr.orientation.y, z: tr.orientation.z, w: tr.orientation.w }
          }));
          sentPose++;

          // Very infrequent logging to avoid DOM overhead
          if (sentPose % 120 === 0) log("Sent pose frames: " + sentPose);
        }
      }

      session.requestAnimationFrame(onFrame);
    } catch (err) {
      log("onFrame error: " + err);
      stopAll("onFrame_error");
    }
  }

  session.requestAnimationFrame(onFrame);
};
</script>
</body>
</html>
