<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AirBrush — Wand Controller</title>
<style>
  :root {
    --bg: #0d1117; --fg: #c9d1d9; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --card: #161b22;
    --border: #30363d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh; padding: 1rem;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 1.5rem; margin-bottom: .5rem; color: var(--accent); }
  .status { font-weight: 600; padding: .25rem .6rem; border-radius: .4rem; font-size: .85rem; }
  .status.on  { background: var(--green); color: #000; }
  .status.off { background: var(--red); color: #fff; }
  #tracking { font-size: .8rem; margin-top: .25rem; opacity: .7; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: .75rem; padding: 1rem; width: 100%;
    max-width: 420px; margin-top: .75rem;
  }

  .btn-row { display: flex; gap: .5rem; flex-wrap: wrap; }
  button {
    flex: 1; min-width: 100px; padding: .65rem .8rem;
    border: none; border-radius: .5rem; font-size: .95rem;
    font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  button:active { opacity: .7; }
  #btn-connect  { background: var(--accent); color: #000; }
  #btn-calibrate { background: #8b949e; color: #000; }
  #btn-arm   { background: var(--green); color: #000; }
  #btn-kill  {
    background: var(--red); color: #fff;
    font-size: 1.3rem; padding: 1rem;
    min-width: 100%; margin-top: .5rem;
  }

  pre#pose-data {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: .8rem; white-space: pre-wrap; line-height: 1.5;
    min-height: 3.5rem; color: var(--accent);
  }

  label { font-size: .85rem; display: block; margin-top: .5rem; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select {
    width: 100%; padding: .4rem; border-radius: .4rem;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    font-size: .9rem; margin-top: .25rem;
  }
  .slider-row { display: flex; align-items: center; gap: .5rem; }
  .slider-row span { min-width: 2.5rem; text-align: right; font-size: .85rem; }
</style>
</head>
<body>

<h1>AirBrush</h1>
<span id="status" class="status off">Disconnected</span>
<div id="tracking">Not tracking</div>

<div class="card">
  <div class="btn-row">
    <button id="btn-connect">Connect</button>
    <button id="btn-calibrate">Calibrate Zero</button>
    <button id="btn-arm">Arm</button>
  </div>
  <button id="btn-kill">KILL SWITCH</button>
</div>

<div class="card">
  <pre id="pose-data">No pose data yet</pre>
</div>

<div class="card">
  <label for="brightness">Brightness</label>
  <div class="slider-row">
    <input type="range" id="brightness" min="0" max="1" step="0.01" value="0.5">
    <span id="brightness-val">0.50</span>
  </div>

  <label for="mode-select">Control Mode</label>
  <select id="mode-select">
    <option value="yaw_pitch" selected>Yaw + Pitch (safe)</option>
    <option value="full">Full (yaw + pitch + roll)</option>
  </select>
</div>

<script type="module" src="ui.js"></script>
</body>
</html>
