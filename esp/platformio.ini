; AirBrush ESP32 firmware
; Flash:  pio run -t upload -e esp32
; Monitor: pio device monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=0
